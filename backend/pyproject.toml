[project]
name = "simplestwins-backend"
version = "0.6.1"
description = "SimplestWins backend: benchmark problem definitions and the lowest-complexity-method recommendation service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# The API does not import scikit-learn; only the benchmark runner does, so it
# stays out of the core dependency set and off the deployed API image.
benchmarks = [
    "scikit-learn>=1.5",
]
dev = [
    "scikit-learn>=1.5",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["seed/*/*.json", "benchmarks/datasets/*/data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# scikit-learn ships no py.typed marker. Narrowed to the one dependency that
# needs it rather than relaxing strict mode across the project.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
