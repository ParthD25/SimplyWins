name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand, which matters when a run has failed for a
  # reason outside the code and needs retrying once that is resolved.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs delegate to scripts/ci.sh so the checks CI runs and the checks a
# contributor can run locally are the same commands, not two copies that drift.
jobs:
  backend:
    name: Backend (tests, lint, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Checks
        run: scripts/ci.sh backend

  frontend:
    name: Frontend (syntax, render, accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium

      - name: Checks
        run: scripts/ci.sh frontend
